[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-sorter"
version = "0.1.0"
description = "Sort a camera roll into folders with Claude, find duplicates, and watch it on a local dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "imagehash>=4.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
photo-sorter = "photosorter.__main__:main"

[tool.setuptools.packages.find]
include = ["photosorter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
